<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台風情報マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
      :root {
        --bg: #08161f;
        --panel: rgba(12, 24, 35, 0.82);
        --text: #edf6ff;
        --muted: #a5bfd6;
        --line: rgba(255,255,255,0.12);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(180deg, #07141d, #0d1d2d);
        color: var(--text);
        font-family: sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .topbar {
        padding: 14px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        background: rgba(9,18,28,0.9);
      }
      .title {
        font-size: 1.2rem;
        font-weight: 700;
      }
      select {
        padding: 10px 14px;
        font-size: 1rem;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
      }
      #map {
        flex: 1;
        min-height: 520px;
        width: 100%;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        padding: 10px 18px 0;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.45);
      }
      .leaflet-container { background: #0d1d2d; }
      .fct-label {
        background: rgba(20, 30, 42, 0.28);
        color: rgba(255,255,255,0.9);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        backdrop-filter: blur(2px);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title">台風情報マップ</div>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="swatch" style="background: rgba(255,255,255,0.18);"></span>予報円</span>
      <span class="legend-item"><span class="swatch" style="background: rgba(248,231,107,0.7);"></span>強風域</span>
      <span class="legend-item"><span class="swatch" style="background: rgba(255,75,75,0.7);"></span>暴風域 / 暴風警戒域</span>
      <span class="legend-item"><span class="swatch" style="background: rgba(248, 196, 15, 0.9);"></span>実際に通った経路</span>
      <span class="legend-item"><span class="swatch" style="background: rgba(30, 166, 255, 0.9);"></span>予想経路</span>
      <span class="legend-item"><span class="swatch" style="background: rgba(255,255,255,0.95);"></span>中心位置</span>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
      const map = L.map('map').setView([35, 138], 4);
      L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>',
        maxZoom: 18,
        minZoom: 3
      }).addTo(map);

      const layerGroup = L.layerGroup().addTo(map);
      const actualPathGroup = L.layerGroup().addTo(map);
      const forecastPathGroup = L.layerGroup().addTo(map);

      function formatLabel(dateStr) {
        const d = new Date(dateStr);
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        return `${d.getDate()}日(${days[d.getDay()]}) ${String(d.getHours()).padStart(2, '0')}時`;
      }

      function centerMarker(pos, text) {
        const p1 = L.polyline([[pos[0] - 0.35, pos[1]], [pos[0] + 0.35, pos[1]]], { color: 'rgba(255,255,255,0.7)', weight: 3, opacity: 0.7 });
        const p2 = L.polyline([[pos[0], pos[1] - 0.45], [pos[0], pos[1] + 0.45]], { color: 'rgba(255,255,255,0.7)', weight: 3, opacity: 0.7 });
        layerGroup.addLayer(p1);
        layerGroup.addLayer(p2);

        if (text) {
          const m = L.marker(pos, {
            icon: L.divIcon({ className: 'fct-label', html: `<span>${text}</span>`, iconSize: [100, 24], iconAnchor: [50, 12] })
          });
          layerGroup.addLayer(m);
        }
      }

      function polarToLatLng(center, radiusMeters, ang) {
        const lat = center[0] + (radiusMeters / 111000) * Math.sin((ang - 90) * Math.PI / 180);
        const lng = center[1] + (radiusMeters / (111000 * Math.cos(center[0] * Math.PI / 180))) * Math.cos((ang - 90) * Math.PI / 180);
        return [lat, lng];
      }

      function makeArc(center, radius, start, end) {
        const pts = [];
        for (let a = start; a <= end; a += 1) {
          pts.push(polarToLatLng(center, radius, a));
        }
        return L.polygon(pts, {
          color: '#ff4b4b',
          fillColor: '#ff4b4b',
          fillOpacity: 0.25,
          opacity: 1,
          weight: 1.5
        });
      }

      function drawTyphoon(forecast) {
        const actualPoints = [];
        const forecastPoints = [];
        const allBounds = [];

        for (const item of forecast) {
          const track = item.track || {};
          if (Array.isArray(track.preTyphoon)) {
            actualPoints.push(...track.preTyphoon);
            allBounds.push(...track.preTyphoon);
          }
          if (Array.isArray(track.typhoon)) {
            actualPoints.push(...track.typhoon);
            allBounds.push(...track.typhoon);
          }

          if (Array.isArray(item.center)) {
            forecastPoints.push(item.center);
            allBounds.push(item.center);
          }

          const advancedHours = Number(item.advancedHours || 0);

          if (item.galeWarningArea && advancedHours === 0) {
            layerGroup.addLayer(L.circle(item.galeWarningArea.center, {
              radius: Number(item.galeWarningArea.radius) || 0,
              color: '#f8e76b',
              weight: 2,
              opacity: 1,
              fillColor: '#f8e76b',
              fillOpacity: 0.42
            }));
          }

          if (item.stormWarningArea && advancedHours === 0) {
            for (const arc of item.stormWarningArea.arc || []) {
              const center = arc[0];
              const radius = Number(arc[1]) || 0;
              const start = Number(arc[2][0]) || 0;
              const end = Number(arc[2][1]) || 360;
              layerGroup.addLayer(makeArc(center, radius, start, end));
            }
          }

          if (item.center && advancedHours === 0) {
            centerMarker(item.center, '実況');
          }

          if (item.probabilityCircle) {
            const pc = item.probabilityCircle;
            layerGroup.addLayer(L.circle(item.center, {
              radius: Number(pc.radius) || 0,
              color: '#ffffff',
              weight: 1.5,
              opacity: 0.7,
              fillOpacity: 0,
              dashArray: '6 8'
            }));

            for (const tangent of pc.tangent || []) {
              if (Array.isArray(tangent) && tangent.length === 2) {
                layerGroup.addLayer(L.polyline(tangent, { color: '#ffffff', weight: 1.5, opacity: 0.7 }));
              }
            }

            if (item.validtime && item.validtime.JST) {
              const marker = L.marker([item.center[0] - 0.5, item.center[1]], {
                icon: L.divIcon({ className: 'fct-label', html: `<span>${formatLabel(item.validtime.JST)}</span>`, iconSize: [120, 24], iconAnchor: [60, 12] })
              });
              layerGroup.addLayer(marker);
            }
          }
        }

        if (actualPoints.length >= 2) {
          actualPathGroup.addLayer(L.polyline(actualPoints, { color: '#f1c40f', weight: 4, opacity: 0.9 }));
        }

        if (forecastPoints.length >= 2) {
          forecastPathGroup.addLayer(L.polyline(forecastPoints, { color: '#1ea6ff', weight: 3, opacity: 0.9, dashArray: '8 8' }));
        }

        const last = forecast[forecast.length - 1];
        if (last && last.stormWarningArea) {
          for (const arc of last.stormWarningArea.arc || []) {
            const center = arc[0];
            const radius = Number(arc[1]) || 0;
            const start = Number(arc[2][0]) || 0;
            const end = Number(arc[2][1]) || 360;
            layerGroup.addLayer(makeArc(center, radius, start, end));
          }
          for (const line of last.stormWarningArea.line || []) {
            if (Array.isArray(line) && line.length >= 2) {
              layerGroup.addLayer(L.polyline(line, { color: '#ff4b4b', weight: 2, opacity: 1 }));
            }
          }
        }

        return allBounds;
      }

      function loadAllTyphoons() {
        layerGroup.clearLayers();
        actualPathGroup.clearLayers();
        forecastPathGroup.clearLayers();

        fetch('https://www.jma.go.jp/bosai/typhoon/data/targetTc.json')
          .then(r => r.json())
          .then((items) => {
            return Promise.all(items.map(item =>
              fetch(`https://www.jma.go.jp/bosai/typhoon/data/${item.tropicalCyclone}/forecast.json`)
                .then(res => res.json())
                .then(forecast => ({ item, forecast }))
            ));
          })
          .then((all) => {
            const bounds = [];
            all.forEach(({ forecast }) => {
              const result = drawTyphoon(forecast);
              if (Array.isArray(result)) {
                bounds.push(...result);
              }
            });
            if (bounds.length) {
              map.fitBounds(bounds, { padding: [20, 20] });
            }
          })
          .catch((err) => {
            console.error('台風データ取得に失敗しました', err);
          });
      }

      loadAllTyphoons();
    </script>
  </body>
</html>
